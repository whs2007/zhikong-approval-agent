name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

# 后端代码位于仓库的 zhikong/ 子目录；gitleaks 仍扫描整个仓库（含 docs）
defaults:
  run:
    working-directory: zhikong

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 质量门禁（ruff / mypy / pytest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖（锁定版本，保证与生产一致）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install -r requirements-dev.txt

      - name: Lint（ruff）
        run: ruff check .

      - name: 类型检查（mypy）
        run: mypy .

      - name: 测试（pytest）
        run: pytest

      - name: 离线评测（风险分级/注入鲁棒性/检索召回，阈值 90%）
        run: python scripts/run_eval.py --threshold 0.9

      - name: 依赖锁一致性
        run: python scripts/gen_lock.py --check

  security:
    name: 安全门禁（依赖漏洞 / 秘密扫描）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks 需要完整历史才能扫描"已删除但曾出现"的秘密
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依赖漏洞审计（pip-audit）
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements.txt

      # 直接跑官方二进制，不用 gitleaks-action：
      # 该 action 在"首次推送"时会拼出 <root-commit>^..HEAD，根提交无父节点导致
      # git 报错 → action 判失败（日志实为 "no leaks found"）。显式 --log-opts=--all
      # 扫描全部历史，行为确定且可本地复现。
      - name: 秘密扫描（gitleaks，全历史）
        working-directory: .
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
          # 失败即中断（exit-code=2 表示"发现泄露"），红输出已 redact
          /tmp/gitleaks git \
            --config "${GITHUB_WORKSPACE}/.gitleaks.toml" \
            --redact --no-banner --verbose --exit-code 2 \
            --log-opts="--all" \
            "${GITHUB_WORKSPACE}"
