# 智控 · Prometheus 告警规则（T1 可观测性闭环）
#
# 三条核心 SLO 告警：
#   1. ErrorRateHigh      —— 近 5 分钟 HTTP 5xx 错误率 > 5%
#   2. LatencyP95High     —— 近 5 分钟「提交流程」P95 延迟 > 800ms
#   3. LLMDegradation     —— 近 10 分钟出现任意 LLM 降级（fallback），说明主模型
#                            不可用 / 被限流 / 并发打满，须立即关注。
#
# 送达链路：Prometheus 评估规则 → Alertmanager（alertmanager.yml 路由）
#           → webhook 接收端（scripts/alert_webhook_receiver.py）。
# 闭环验证记录见 docs/22-告警闭环验证.md：LLMDegradation 曾被真实触发并送达。

groups:
  - name: zhikong_slo
    rules:
      - alert: ErrorRateHigh
        expr: |
          (
            sum(rate(zhikong_http_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(zhikong_http_requests_total[5m]))
          ) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 5xx 错误率超过 5%"
          description: "近 5 分钟 5xx 错误率 {{ $value | humanizePercentage }}，超过 5% 阈值，请排查下游依赖与异常。"

      # 阈值 800ms 的来历（不是拍脑袋，见 docs/21 实测）：
      #   10 并发 P95 = 126ms，25 并发 = 315ms，100 并发 = 1097ms。
      #   800ms 落在「正常负载的 2.5 倍」与「过载」之间，能在用户明显感知前预警；
      #   原先的 3s 阈值压测全程都够不到（峰值 1.24s），等于永不触发。
      #
      # 为什么按 path 过滤：延迟直方图混入了 /health 与 /metrics 抓取（<1ms），
      # 会把整体 P95 稀释掉，导致真实慢请求被平均掉、告警失灵。
      # 为什么 submit 与 submit/stream 合并统计：两者走同一张图、同一套节点，
      # 延迟特征一致；合并可避免低频路径样本太少导致分位数抖动。
      - alert: LatencyP95High
        expr: |
          histogram_quantile(0.95,
            sum(rate(zhikong_http_request_duration_seconds_bucket{path=~"/api/v1/workflow/submit.*"}[5m])) by (le)
          ) > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "提交流程 P95 延迟超过 800ms"
          description: "近 5 分钟提交流程 P95 延迟 {{ $value | humanizeDuration }}，超过 800ms，疑似排队或存储锁竞争（见 docs/21）。"

      - alert: LLMDegradation
        expr: increase(zhikong_llm_calls_total{outcome="fallback"}[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "LLM 降级被触发"
          description: "近 10 分钟出现 {{ $value }} 次 LLM 降级（fallback），主模型可能不可用、被限流或并发打满。"
